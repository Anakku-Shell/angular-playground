<header class="app-header">
  <a class="app-header__brand" routerLink="/">{{ appTitle }}</a>
  <span class="app-header__version">Angular {{ angularVersion }}</span>
</header>

<nav class="app-sidebar" aria-label="Topics">
  <ul class="app-sidebar__list">
    <li>
      <a
        routerLink="/"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>
    </li>
  </ul>

  <h2 class="app-sidebar__heading">Topics</h2>
  <ol class="app-sidebar__list">
    @for (topic of topics; track topic.id) {
      <li>
        <a [routerLink]="topicUrl(topic)" routerLinkActive="is-active" ariaCurrentWhenActive="page">
          <span class="app-sidebar__id">{{ topic.id }}</span>
          {{ topic.title }}
        </a>
      </li>
    } @empty {
      <li class="app-sidebar__empty">No topics yet.</li>
    }
  </ol>
</nav>

<main class="app-main">
  <router-outlet />
</main>
