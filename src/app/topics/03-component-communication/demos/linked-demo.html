<!--
  THE PARENT of the linked demo. Read linked-demo.ts, this file, then linked/option-picker.ts.

  The parent passes sizes() down. The child keeps its own selection with linkedSignal():
  writable like a signal, but recomputed whenever the input it depends on changes.
    computed()       derived, read-only
    linkedSignal()   derived, writable, resets when its source changes
    signal()         independent state, never resets on its own
-->
<div class="demo-row">
  <label for="linked-category">Category (parent)</label>
  <select id="linked-category" (change)="onCategory($event)">
    @for (option of categories; track option) {
      <option [value]="option" [selected]="option === category()">{{ option }}</option>
    }
  </select>
</div>

<!-- Pick a size, then change the category: the child's selection resets to the first size. -->
<div class="demo-row">
  <app-option-picker label="Size" [options]="sizes()" />
</div>
