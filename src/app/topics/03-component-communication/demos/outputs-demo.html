<!--
  THE PARENT of the outputs demo. Read outputs/star-rating.ts (the child) first.

  (rated)="onRated($event)" listens to the child's output, exactly like a DOM event.
  $event is the value passed to emit(): a number here.
  Outputs do not bubble: only the direct parent can listen. Older code declares them with
  @Output() rated = new EventEmitter<number>(); the template side is the same.
-->
<div class="demo-row">
  <app-star-rating [value]="rating()" (rated)="onRated($event)" (cleared)="onCleared()" />
</div>

<dl class="demo-values">
  <dt>rating() in the parent</dt>
  <dd class="rating">{{ rating() }}</dd>
  <dt>Events received</dt>
  <dd>
    <ul class="event-log">
      @for (entry of log(); track $index) {
        <li>{{ entry }}</li>
      } @empty {
        <li class="muted">None yet: click a star.</li>
      }
    </ul>
  </dd>
</dl>
