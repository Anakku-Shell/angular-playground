<!--
  Reading and writing a signal:
    quantity()                 read (and, inside a computed/effect/template, subscribe to it)
    quantity.set(5)            replace the value
    quantity.update(n => n+1)  derive the next value from the current one
    quantity.asReadonly()      a read-only view to hand out
  computed() is lazy and cached: it runs when something reads it and a dependency changed.
-->
<div class="demo-row">
  <span>
    Quantity: <strong>{{ quantity() }}</strong>
  </span>
  <button type="button" (click)="add(-1)">−1</button>
  <button type="button" (click)="add(1)">+1</button>
  <button type="button" (click)="reset()">Reset</button>
  <button type="button" [attr.aria-pressed]="showTotal()" (click)="toggleTotal()">
    {{ showTotal() ? 'Hide total' : 'Show total' }}
  </button>
</div>

<dl class="demo-values">
  <dt>total() at {{ unitPrice | currency: 'EUR' }} each</dt>
  <dd class="total">
    @if (showTotal()) {
      {{ total().amount | currency: 'EUR' }}
      <span class="muted">(computation run #{{ total().run }})</span>
    } @else {
      <span class="muted">Hidden: nothing reads total(), so it does not run</span>
    }
  </dd>
</dl>
