<!--
  (event)="statement" listens to a DOM event (any name: click, input, mousemove, focus, scroll...)
  or to a component's output. The statement can call a method or set a signal, and $event holds
  the event object. Ways to write the same handler:
    (click)="onClick($event)"          method call (preferred: readable, testable)
    (click)="count.set(count() + 1)"   short inline statement
    (click)="a(); b()"                 several statements, separated by ;
-->
<button type="button" class="click-area" (click)="onClick($event)">{{ lastClick() }}</button>

<div class="demo-row">
  <label>
    New item
    <!--
      Key filters run the handler only for that key: (keyup.enter), (keyup.escape),
      (keydown.arrowdown), (keydown.control.s), (keyup.shift.enter)...
      Modifiers must match exactly: (keyup.enter) does not fire while Shift is held.
    -->
    <input
      type="text"
      placeholder="Enter adds, Escape clears"
      [value]="draft()"
      (input)="onInput($event)"
      (keyup.enter)="add()"
      (keyup.escape)="clear()"
    />
  </label>
  <span>Draft: "{{ draft() }}"</span>
</div>

<!-- Plain strings with possible duplicates and no id: $index is the right key here (see Control flow). -->
<ul class="items">
  @for (item of items(); track $index) {
    <li>{{ item }}</li>
  }
</ul>
