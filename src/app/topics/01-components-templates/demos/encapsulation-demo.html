<!-- Three child components with the same template and the same class name (.enc-sample), each
     with a different ViewEncapsulation. Compare how far each one's styles reach. -->
<label class="demo-row">
  <input type="checkbox" [checked]="showNone()" (change)="showNone.set(!showNone())" />
  Render the ViewEncapsulation.None component
</label>

<div class="samples">
  <app-emulated-sample />
  <app-shadow-sample />
  <!-- @if creates and destroys the component, so its global styles come and go with it. -->
  @if (showNone()) {
    <app-none-sample />
  }
</div>

<!-- An element of this (parent) component with the same class: only None's rule reaches it. -->
<p class="enc-sample">Parent paragraph with class "enc-sample"</p>
