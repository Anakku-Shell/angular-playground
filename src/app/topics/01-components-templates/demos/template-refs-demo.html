<!--
  Read this template first, then template-refs-demo.ts.

  #name declares a template reference variable. What it points to depends on where it is:
    on an HTML element     →  the DOM element (here an HTMLInputElement)
    on a component         →  the component instance (call its public methods)
    #m="ngModel"           →  a directive, by its exportAs name (see Forms)
  It is visible anywhere in this template. One declared inside an @if or @for block is only
  visible inside that block.
  To reach the same element from the class, use viewChild('name') (see Component communication).
-->
<div class="demo-row">
  <!-- [1] The declaration: #nameInput is this <input> element. -->
  <label>
    Name
    <input #nameInput type="text" placeholder="Type, then press Greet" />
  </label>
  <!-- [2] Read a property of the element and pass it to the class. -->
  <button type="button" (click)="greet(nameInput.value)">Greet</button>
  <!-- [3] Or call one of its methods directly. -->
  <button type="button" (click)="nameInput.focus()">Focus the input</button>
</div>

<div class="demo-row">
  <dl class="demo-values">
    <dt>greeting()</dt>
    <dd>{{ greeting() || '—' }}</dd>

    <!-- [4] Gotcha: typing fires no Angular event here, so nothing triggers a re-render.
       This line only catches up when a button is clicked. -->
    <dt>nameInput.value</dt>
    <dd>"{{ nameInput.value }}"</dd>
  </dl>
</div>
